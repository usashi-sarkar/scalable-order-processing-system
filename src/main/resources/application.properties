spring.application.name=scalable-order-processing-system
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/order_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-processing-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.jwt.secret=interview-demo-secret-key-change-this-in-production-please-keep-it-long
app.jwt.expiration-ms=86400000
app.kafka.order-topic=orders.created
app.rate-limit.requests-per-minute=60

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

springdoc.swagger-ui.path=/swagger-ui.html
logging.level.com.interview.ordersystem=INFO
spring.main.allow-circular-references=true
